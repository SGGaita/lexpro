version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lexprodb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-lexprodb}
    ports:
      # Bound to localhost only; remove in production
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lexpro-network

  api:
    build: ./backend
    container_name: lexpro-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Secrets come from the root .env file (see .env.example); nothing is hardcoded here.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lexpro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lexprodb}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the root .env file}
      ENCRYPTION_KEYS_OLD: ${ENCRYPTION_KEYS_OLD:-}
      ENABLE_ADMIN_ROUTES: ${ENABLE_ADMIN_ROUTES:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - lexpro-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: lexpro-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - api
    networks:
      - lexpro-network

  nginx:
    build: ./nginx
    container_name: lexpro-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    networks:
      - lexpro-network

volumes:
  pgdata:
  uploads_data:

networks:
  lexpro-network:
    driver: bridge
